name: Build

on:
  push:
    branches:
      - '1.20.1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer push to the same branch makes an in-flight run pointless, and these runs are long
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest

    # ForgeGradle downloads and decompiles Minecraft on a cold cache, which is slow the first
    # time and much faster afterwards. The default 6h timeout is no use as a signal.
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository stores gradlew without the executable bit, so a Linux runner cannot
      # invoke it directly.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 'build' covers both halves of what this workflow is for: it compiles main and test, and
      # 'check' runs the JUnit suite over the Minecraft-free detection and scoring core.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 14
