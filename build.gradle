
import net.darkhax.curseforgegradle.TaskPublishCurseForge
import net.darkhax.curseforgegradle.UploadArtifact

plugins {
    id 'net.darkhax.curseforgegradle' version '1.1.26'
    id "com.modrinth.minotaur" version "2.+"
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

def build_number = System.env.BUILD_NUMBER ?: 1
def release_type = System.env.TC_RELEASE_TYPE ?: "alpha"

ext.configFile = file('gradle.properties')
ext.config = parseConfig(configFile)

version = "${minecraft_version}-${neoforge_version}-b${build_number}"
group = 'leaf.soulhome' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
base.archivesName = "${project.jar_name}"

// Mojang ships Java 21 to end users in 1.20.5+, so the mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
    version = project.neoforge_version

    // NeoForge resolves access transformers from the mod jar at runtime, but the compile-time
    // widening has to be declared here for javac to see the wider members.
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            gameDirectory = project.file('run')
        }

        client {
            client()

            //The below if statements are to add args to your gradle.properties file in user home
            // (for me on windows, I created gradle.properties in %userprofile%\.gradle)
            // (DO NOT add them directly to the gradle.properties file for this project)
            if (project.hasProperty('mc_uuid')) {
                //Your uuid without any dashes in the middle
                programArguments.addAll '--uuid', project.getProperty('mc_uuid')
            }
            if (project.hasProperty('mc_username')) {
                //Your username/display name, this is the name that shows up in chat
                // Note: This is not your email, even if you have a Mojang account
                programArguments.addAll '--username', project.getProperty('mc_username')
            }
        }

        server {
            server()
        }

        data {
            data()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', 'soulhome', '--all', '--output', file('src/main/generated/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        soulhome {
            sourceSet sourceSets.main
        }
    }
}

// Let a dev type into the dedicated server's console. ModDevGradle's run tasks are plain JavaExec
// and so get an empty stdin by default, which leaves `runServer` with no way to accept `stop` - or
// any command - and makes the one run configuration that has a console useless for testing.
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/main/generated' }

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        //used for patchouli and JEI
        url "https://maven.blamejared.com/"
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Unit tests. The soulhome structure detection and archetype scoring in
    // leaf.soulhome.structures.core deliberately depend on nothing from Minecraft, so they can be
    // exercised against synthetic worlds without booting the game. Gson comes from the Minecraft
    // classpath rather than being declared here, to avoid two copies on the test classpath.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The test source set can see everything main can, so tests that do need game types later are not
// blocked on rewiring this.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()

    // ArchetypeClassifierTest reads the archetype definitions the mod actually ships, by path,
    // so that a typo in a shipped weight fails a test rather than becoming a gameplay bug
    workingDir = project.projectDir

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "soulhome",
                "Specification-Vendor"    : "soulhome",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "soulhome",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "soulhome.mixins.json"

        ])
    }
}

processResources {
    // Exclude datagenerator .cache directory
    exclude '.cache'

    filesMatching('data/soulhome/patchouli_books/guide/book.json') {
        filter {
            it.replaceAll("buildNumber", "${build_number}")
        }
    }
}

task incrementBuildNumber {
    doFirst {
        config.build_number = (config.build_number.toString().toInteger()) + 1
        configFile.withWriter {
            config.toProperties().store(it, "")
        }
    }
}

def parseConfig(File config) {
    if(config.exists()){
        config.withReader {
            def prop = new Properties()
            prop.load(it)
            return (new ConfigSlurper().parse(prop))
        }
    } else {
        return null
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

def resolvedChangelog = null

//closure to generate the changelog once, and only when needed by CurseGradle
def changeLogResolver = { ->
    String generatedChangelog;

    //autogenerated log via teamcity, which uses a generic powershell script to generate a changelog
    def autogeneratedChangelog = project.file("docs/changelog_Soulhome_${build_number}.txt")
    if (autogeneratedChangelog.exists()) {
        //Add any version specific changelog stuff
        String changelogText = autogeneratedChangelog.getText()
        changelogText = changelogText.replace("+ : ","<br>")
        generatedChangelog = "$changelogText"
    } else {
        generatedChangelog = "Unable to generate changelog :("
    }

    //add hand written log to put at the top
    def releaseNotesFile = project.file("docs/release_${build_number}.txt")
    if (releaseNotesFile.exists()) {
        //Add any version specific changelog stuff
        def releaseNotes = releaseNotesFile.getText()
        generatedChangelog = "$releaseNotes<br>-<br> $generatedChangelog"
    }

    generatedChangelog =
            "Soulhome - Build " + build_number.toString() +
                    "<br><br> $generatedChangelog"
    resolvedChangelog = generatedChangelog
    return generatedChangelog
}

if (System.getenv("CURSEFORGE_API_TOKEN") != null || project.hasProperty('curseforge_api_token')) {
    println "Enabling Curseforge config"
    tasks.register("curseforge", TaskPublishCurseForge, { task ->
        setGroup("publishing")
        setDescription("Upload to CurseForge")
        //https://authors.curseforge.com/account/api-tokens
        apiToken = System.getenv("CURSEFORGE_API_TOKEN") ?: project.findProperty("curseforge_api_token")

        def changelog = changeLogResolver.call()

        task.upload(574511, jar) { main ->
            setGenericCurseArtifactData(main, changelog, release_type)
            //Add optional deps
            addOptional(
                    'patchouli',
                    'jei',
            )
        }
    })
}

void setGenericCurseArtifactData(UploadArtifact artifact, String changelog, String release_type)
{
    artifact.changelog = changelog
    artifact.changelogType = 'text'
    artifact.releaseType = "${release_type}"
    artifact.addModLoader("NeoForge")
}
